    <script>
      (function () {
        var SITE_URL = 'https://sthapatiapp.com';
        var message = document.getElementById('message');
        var retryButton = document.getElementById('retryButton');

        function goToSite() {
          message.textContent = 'Loading Stahapati...';
          retryButton.hidden = true;
          window.location.replace(SITE_URL);
        }

        retryButton.addEventListener('click', goToSite);

        if (/sthapatiapp\.com/i.test(window.location.hostname)) {
          return;
        }

        message.textContent = 'Connecting to Stahapati...';
        setTimeout(function () {
          goToSite();
        }, 300);

        setTimeout(function () {
          if (!/sthapatiapp\.com/i.test(window.location.hostname)) {
            message.textContent =
              'Unable to load Stahapati. Check your internet connection and try again.';
            retryButton.hidden = false;
          }
        }, 8000);
      })();
