name: Build Sthapati iOS App

on:
  push:
    branches: ["main"]
  workflow_dispatch:

env:
  APP_NAME: Sthapati
  IOS_BUNDLE_ID: com.stahapatis.app
  APP_SCHEME: com.stahapatis.app

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Make build script executable
        run: chmod +x scripts/build-ios-app.sh

      - name: Setup Capacitor iOS project
        run: bash scripts/build-ios-app.sh setup

      - name: Verify generated iOS project
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "VERIFYING GENERATED IOS PROJECT"
          echo "========================================"

          test -d ios/App
          echo "PASS: ios/App exists"

          LAUNCH_SCREEN="ios/App/App/Base.lproj/LaunchScreen.storyboard"
          APP_DELEGATE="ios/App/App/AppDelegate.swift"
          MAIN_STORYBOARD="ios/App/App/Base.lproj/Main.storyboard"
          CAP_CONFIG="ios/App/App/capacitor.config.json"
          ICON_DIR="ios/App/App/Assets.xcassets/AppIcon.appiconset"

          echo ""
          echo "Checking LaunchScreen..."

          grep -q 'Loading...' "$LAUNCH_SCREEN"
          echo "PASS: Loading... found"

          if grep -q 'image="Splash"' "$LAUNCH_SCREEN"; then
            echo "FAIL: Splash image still referenced"
            exit 1
          fi

          echo "PASS: Splash image not referenced"

          echo ""
          echo "Checking AppDelegate..."

          grep -q 'hideSplashWhenWebViewIsReady' "$APP_DELEGATE"
          echo "PASS: hideSplashWhenWebViewIsReady"

          echo ""
          echo "Checking app icon..."

          if [ ! -f "${ICON_DIR}/icon-1024.png" ]; then
            echo "FAIL: icon-1024.png missing"
            exit 1
          fi

          echo "PASS: icon-1024.png"

          echo ""
          echo "Checking Main.storyboard..."

          grep -q 'customClass="StahapatiBridgeViewController"' "$MAIN_STORYBOARD"
          echo "PASS: StahapatiBridgeViewController"

          grep -q 'customModule="App"' "$MAIN_STORYBOARD"
          echo "PASS: customModule=App"

          if grep -q 'customClass="StahapatiBridgeViewController" customModule="Capacitor"' "$MAIN_STORYBOARD"; then
            echo "FAIL: Bridge still uses Capacitor module"
            exit 1
          fi

          echo "PASS: Bridge does not use Capacitor module"

          echo ""
          echo "========================================"
          echo "GOOGLE OAUTH CONFIGURATION"
          echo "========================================"

          echo ""
          echo "Searching capacitor.config.json for OAuth hosts..."

          grep -n -E 'google|gstatic|withgoogle|Safari' "$CAP_CONFIG" || true

          echo ""
          echo "Checking accounts.google.com..."

          if grep -qi 'accounts.google.com' "$CAP_CONFIG"; then
            echo "PASS: accounts.google.com"
          else
            echo "FAIL: accounts.google.com missing"
            exit 1
          fi

          echo ""
          echo "Checking gstatic.com..."

          if grep -qi 'gstatic.com' "$CAP_CONFIG"; then
            echo "PASS: gstatic.com"
          else
            echo "FAIL: gstatic.com missing"
            exit 1
          fi

          echo ""
          echo "Checking withgoogle.com..."

          if grep -qi 'withgoogle.com' "$CAP_CONFIG"; then
            echo "PASS: withgoogle.com"
          else
            echo "FAIL: withgoogle.com missing"
            exit 1
          fi

          echo ""
          echo "Checking Safari user-agent configuration..."

          if grep -q 'Safari/604.1' "$CAP_CONFIG"; then
            echo "PASS: Safari/604.1"
          else
            echo "WARNING: Safari/604.1 not found"
          fi

          echo ""
          echo "Checking AppDelegate OAuth implementation..."

          for pattern in \
            'StahapatiInAppNavigationProxy' \
            'createWebViewWith' \
            'shouldCapturePopup' \
            'oauthPopupWebView' \
            'inAppGoogleOAuthNoSafariHandoff'
          do
            if grep -q "$pattern" "$APP_DELEGATE"; then
              echo "PASS: $pattern"
            else
              echo "FAIL: $pattern missing"
              exit 1
            fi
          done

          echo ""
          echo "Checking old Safari cleanup..."

          if grep -q 'clearCancelledGoogleOAuthIfNeeded' "$APP_DELEGATE"; then
            echo "FAIL: Old Safari cleanup still exists"
            exit 1
          fi

          echo "PASS: Old Safari cleanup removed"

          echo ""
          echo "Running OAuth validation script..."

          python3 scripts/validate-in-app-oauth.py

          echo ""
          echo "Checking application name..."

          DISPLAY_NAME=$(
            /usr/libexec/PlistBuddy \
              -c "Print :CFBundleDisplayName" \
              ios/App/App/Info.plist
          )

          if [ "$DISPLAY_NAME" != "Sthapati" ]; then
            echo "FAIL: Expected Sthapati, got $DISPLAY_NAME"
            exit 1
          fi

          echo "PASS: App name is Sthapati"

          echo ""
          echo "========================================"
          echo "ALL VERIFICATION CHECKS PASSED"
          echo "========================================"

      - name: Build iOS app
        run: bash scripts/build-ios-app.sh build

      - name: Find App.app
        shell: bash
        run: |
          APP_PATH=$(find build/DerivedData \
            -type d \
            -name "App.app" \
            -print -quit)

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: App.app not found"
            find build -maxdepth 6 -print
            exit 1
          fi

          echo "App found:"
          echo "$APP_PATH"

      - name: Package App.zip
        shell: bash
        run: |
          APP_PATH=$(find build/DerivedData \
            -type d \
            -name "App.app" \
            -print -quit)

          mkdir -p artifacts

          ditto -c -k \
            --sequesterRsrc \
            --keepParent \
            "$APP_PATH" \
            "artifacts/App.zip"

          echo "App.zip created successfully"

      - name: Upload App.zip
        uses: actions/upload-artifact@v4
        with:
          name: App.zip
          path: artifacts/App.zip
          if-no-files-found: error
