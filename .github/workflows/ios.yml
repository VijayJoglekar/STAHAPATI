name: iOS starter workflow

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  APP_NAME: Stahapati
  IOS_BUNDLE_ID: com.stahapatis.app
  APP_SCHEME: com.stahapatis.app

jobs:
  build-ios:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Make script executable
        run: chmod +x scripts/build-ios-app.sh

      - name: Setup iOS project
        run: bash scripts/build-ios-app.sh setup

      - name: Verify startup screen has no logo
        run: |
          grep -q 'Loading...' ios/App/App/Base.lproj/LaunchScreen.storyboard
          if grep -q 'image="Splash"' ios/App/App/Base.lproj/LaunchScreen.storyboard; then
            echo "LaunchScreen still references the Splash logo image" >&2
            exit 1
          fi
          grep -q 'hideSplashWhenWebViewIsReady' ios/App/App/AppDelegate.swift
          grep -q 'handleStahapatiOAuthReturn' ios/App/App/AppDelegate.swift

          ICON_DIR="ios/App/App/Assets.xcassets/AppIcon.appiconset"
          if [ ! -f "${ICON_DIR}/icon-1024.png" ]; then
            echo "ERROR: App icon assets were not generated from logo.png."
            exit 1
          fi

          /usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" ios/App/App/Info.plist | grep -qx "Stahapati"
          /usr/libexec/PlistBuddy -c "Print :CFBundleURLTypes:0:CFBundleURLSchemes:0" ios/App/App/Info.plist | grep -qx "com.stahapatis.app"

          echo "Startup screen is Loading... (no logo). App icon and OAuth URL scheme verified."

      - name: Build iOS app
        run: bash scripts/build-ios-app.sh build

      - name: Package iOS app
        run: |
          APP_PATH=$(find build/DerivedData -type d -name "App.app" -print -quit)

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: App.app was not found."
            echo "Contents of build directory:"
            find build -maxdepth 6 -print
            exit 1
          fi

          echo "Found app at: $APP_PATH"
          mkdir -p artifacts
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "artifacts/App.zip"

      - name: Upload iOS app
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-build
          path: artifacts/App.zip
          if-no-files-found: error
